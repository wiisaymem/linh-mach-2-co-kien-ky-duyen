,1,900]];let p,world,log=[],fx=[],shots=[],keys={},panel='',last=0,tick=0,cam={x:0,y:0},notice=0,attackAnim=0,cd=[],weather=false,flash=0,evtimer=0,dirty=0,audio;let W=1792,H=1280;const T=32;function fresh(){return {x:740,y:570,map:0,inside:'',hp:120,mp:90,exp:0,r:0,sect:-1,gold:90,root:'Thiên linh căn · Mộc',bag:{hp:5,mp:4,pill:3,herb:0,ore:0,weapon:0,armor:0,hat:0,ring:0,manual:0},chest:{},eq:{weapon:0,armor:0,hat:0,ring:0},skills:Array(7).fill(1),points:5,q:0,progress:Array(10).fill(0),done:[],side:{hunt:0,gather:0,deliver:0,lost:0},sideDone:[],kills:0,steps:0,med:0,dir:0,time:90,pet:0,guard:0,ending:false};}function stats(){let n=1+p.r*.65;return {hp:Math.round(120*n+p.eq.armor*35+p.eq.hat*18),mp:Math.round(90*n+p.eq.ring*20),atk:Math.round(17*n+p.eq.weapon*8),def:Math.round(3*n+p.eq.armor*4),speed:148+(p.sect===0?28:0)+p.r*4,need:150*(p.r+1)*(p.r+1)};}const maps=[];function rand(n){let v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v);}function mkMaps(){for(let m=0;m<7;m++){let a={trees:[],rocks:[],flowers:[],houses:[],npcs:[],portals:[],enemies:[],drops:[],spirit:{x:1050,y:480}};for(let i=0;i<96;i++){let x=80+rand(i+m*101)*1370,y=70+rand(i+m*113+11)*880;if(Math.abs(y-550)<100||Math.abs(x-750)<95||Math.hypot(x-1050,y-480)<90)continue;(m===5?a.rocks:a.trees).push({x,y,size: .8+rand(i+88)*.6});}for(let i=0;i<70;i++)a.flowers.push({x:rand(i+m*53)*W,y:rand(i+170)*H,c:i%4});for(let i=0;i<18;i++)a.rocks.push({x:rand(i+88+m)*W,y:rand(i+313)*H,size:1});if([0,2,3].includes(m))a.houses=[{x:510,y:405,id:'home',name:m===0?'Nhà của bạn':m===2?'Quán trọ Vân Hà':'Tĩnh thất'},{x:1000,y:715,id:'work',name:m===0?'Nhà Lão Thạch':m===2?'Đan phường':'Tàng kinh các'}];a.npcs=m===0?[{x:720,y:480,name:'Lão Thạch',type:'old'}]:m===2?[{x:740,y:480,name:'Bà chủ Vân Hà',type:'inn'},{x:925,y:540,name:'Thương nhân',type:'shop'}]:m===3?[{x:760,y:480,name:'Trưởng lão Vân Trần',type:'elder'}]:[];if(m>0)a.portals.push({x:80,y:550,to:m-1,label:'← '+names[m-1]});if(m<6)a.portals.push({x:W-86,y:550,to:m+1,label:names[m+1]+' →'});if([1,4,5,6].includes(m))for(let i=0;i<(m>4?5:9);i++)a.enemies.push(enemy(880+rand(i+m)*400,380+rand(i+90)*360,m,i===0&&m>4));maps.push(a);}}function enemy(x,y,m,boss=false){let max=boss?(m===6?2800:1100):65+m*32;return {x,y,sx:x,sy:y,hp:max,max,boss,name:boss?(m===6?'Huyết Ma Tôn':'Huyết Giao'):m===1?'Sơn lang':m===4?'Độc trùng':'Ma linh',cool:0,slow:0,poison:0,dead:0};}mkMaps();function area(){return maps[p.map];}function say(s){log.unshift({t:Math.floor(tick),text:s});log=log.slice(0,60);$('#toast').textContent=s;$('#toast').style.opacity=1;notice=3;}function sound(f=300){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,audio.currentTime+.14);v.gain.setValueAtTime(.055,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.2);}catch(e){}}function gain(type,n=1){quests.forEach((q,i)=>{if(q[2]===type)p.progress[i]=Math.min(q[3],p.progress[i]+n);});if(type==='kill'||type==='swamp'){p.side.hunt+=n;p.kills+=n;}if(p.q<10&&p.progress[p.q]>=quests[p.q][3]){let q=quests[p.q];p.exp+=q[4];p.gold+=q[4]/2;p.points+=2;p.bag.pill++;p.done.push(q[0]);p.q++;say('Hoàn thành: '+q[0]+' · +'+q[4]+' tu vi, +1 đột phá đan');sound(680);if(p.q===10){p.ending=true;setTimeout(ending,300);}}}function save(){try{localStorage.setItem('linhmach.v1',JSON.stringify({p,log,boss:maps.map(a=>a.enemies.filter(e=>e.boss).map(e=>e.dead))}));say('Đã lưu hành trình.');return true;}catch(e){say('Trình duyệt chặn lưu trữ. Hãy tải file HTML về máy.');return false;}}function load(){try{let s=JSON.parse(localStorage.getItem('linhmach.v1'));if(!s||!s.p){say('Chưa có bản lưu trên trình duyệt này.');return false;}p={...fresh(),...s.p,auto:!!s.p.auto};log=s.log||[];maps.forEach((a,i)= function title(){p=fresh();show('LINH MẠCH · Cổ Kiếm Kỳ Duyên','<p class="muted">MỘT ĐỜI PHÀM NHÂN · CHÍN TẦNG TIÊN LỘ</p><p>Bên giếng cổ Tiểu Thạch, một thiếu niên nghèo nghe tiếng linh mạch đang tắt dần. Một thanh kiếm gỗ. Năm con đường tu đạo. Và bí mật dưới núi Thanh Vân.</p>'+btn('Bắt đầu hành trình','RPG.start()')+btn('Tiếp tục','RPG.load()')+btn('Hướng dẫn','RPG.help()')+'<p><small>Không cần mạng sau khi tải HTML. Tiến độ lưu trên trình duyệt này. Bản phiêu lưu độc lập, hình ảnh hoàn toàn vẽ bằng mã.</small></p>');}function help(){show('Cẩm nang hành tẩu','<p>WASD / mũi tên: di chuyển · J / Space: đánh thường · 1–7: ra chiêu · E: tương tác · T: thiền · B: đột phá · H: đan hồi máu · M: đan linh khí.</p><p>I: túi đồ · C: nhân vật · Q: nhiệm vụ · K: kỹ năng · L: sự kiện · Esc: đóng bảng. Nhấn cổng sáng ở hai đầu đường để chuyển khu. Đứng cạnh cửa nhà rồi nhấn E để vào, E tại thảm để ra.</p><p>Thiền ở vòng linh khí hoặc bàn trong nhà nhanh hơn. Đột phá cần đủ tu vi và 1 đột phá đan. Kỹ năng mở theo cảnh giới, nâng bằng đạo điểm. Quái ngừng hoạt động khi mở bảng.</p><p>Điện thoại: kéo joystick bên trái; chạm icon đạo pháp bên phải. Giữ icon để xem tên. Bấm nhiệm vụ để tự tìm đường; bật Auto bằng icon hai mũi tên. Hạ boss cuối theo nhiệm vụ để kết thúc.</p>'+btn('Trở lại','RPG.close()'));}const itemNames={hp:'Hồi xuân đan',mp:'Tụ khí đan',pill:'Đột phá đan',herb:'Linh thảo',ore:'Linh thạch thô',weapon:'Thanh cương kiếm',armor:'Vân văn áo',hat:'Đạo quan',ring:'Ngọc giới',manual:'Cổ công pháp'};function inventory(){let s=stats();show('Túi đồ · '+Math.floor(p.gold)+' linh thạch',Object.keys(p.bag).map(k=>'<article><b>'+itemNames[k]+'</b> × '+p.bag[k]+' '+(p.bag[k]>0?(k==='hp'||k==='mp'||k==='manual'?btn('Dùng',"RPG.use('"+k+"')"):k==='pill'?btn('Đột phá','RPG.breakthrough()'):['weapon','armor','hat','ring'].includes(k)?btn('Trang bị',"RPG.equip('"+k+"')"):''):'')+'</article>').join('')+'<p>Trang bị hiện tại: '+Object.entries(p.eq).map(([k,v])=>itemNames[k]+' '+(v?'đã ,'RPG.upgrade('+i+')'):'')+'</article>').join(''));}function upgrade(i){if(p.points>0&&p.r>=i){p.points--;p.skills[i]++;skills();}}function selectSkill(i){if(p.r<i)return;p.selected=i;selected=i;close();say('Đã chọn '+skillNames[p.sect][i]);}function questPanel(){show('Thiên mệnh · Nhiệm vụ',quests.map((q,i)=>'<article><small>'+(i<p.q?'ĐÃ HOÀN THÀNH':i===p.q?'ĐANG THỰC HIỆN':'CHƯA NHẬN')+'</small><h3>'+(i+1)+'. '+q[0]+'</h3><p>'+q[1]+' ('+Math.min(p.progress[i],q[3])+'/'+q[3]+')</p><small>Thưởng '+q[4]+' tu vi · '+q[4]/2+' linh thạch · 1 đột phá đan</small></article>').join('')+'<h3>Việc làng · Nhiệm vụ phụ</h3>'+[['hunt','Trừ hại','Hạ 6 quái',6],['gather','Dược viên','Hái 5 linh thảo (E cạnh hoa)',5],['deliver','Chuyển dược','Mang 2 linh thảo cho chủ quán trọ',2],['lost','Ngọc thất lạc','Tìm ngọc gần địa linh sơn mạch (E)',1]].map(([k,n,d,max])=>'<article><b>'+n+'</b> · '+(p.sideDone.includes(k)?'ĐÃ HOÀN THÀNH':p.side[k]===0?'CHƯA NHẬN / có thể làm ngay':'ĐANG LÀM')+'<p>'+d+' · '+Math.min(p.side[k],max)+'/'+max+' · thưởng 120 tu vi, 60 linh thạch</p>'+btn('Nhận thưởng',"RPG.sideReward('"+k+"',"+max+")")+'</article>').join(''));}function sideReward(k,max){if(p.side[k]>=max&&!p.sideDone.includes(k)){p.sideDone.push(k);p.exp+=120;p.gold+=60;say('Đã nhận thưởng việc làng.');questPanel();}else say('Chưa đủ mục tiêu hoặc đã nhận thưởng.');}function journal(){show('Nhật ký thiên địa',log.map(a=>'<article><small>Phút '+Math.floor(a.t/60)+':'+String(a.t%60).padStart(2,'0')+'</small><p>'+a.text+'</p></article>').join('')||'<p>Hành trình đang bắt đầu.</p>');}function shop(){show('Đan phường · '+Math.floor(p.gold)+' linh thạch','<p>Mua đan dược, đổi trang bị. Bán nguyên liệu được 8 linh thạch / món.</p>'+Object.keys(itemNames).map((k,i)=>'<article>'+itemNames[k]+' · '+[18,16,45,12,12,70,65,55,60,90][i]+' linh thạch '+btn('Mua',"RPG.buy('"+k+"',"+[18,16,45,12,12,70,65,55,60,90][i]+")")+btn('Bán · 8',"RPG.sell('"+k+"')")+'</article>').join(''));}function buy(k,c){if(p.gold<c)ret
